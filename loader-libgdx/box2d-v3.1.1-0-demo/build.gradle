plugins {
    id 'application'
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:3.1.1-0:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    implementation files('./libs/tween-engine-api.jar')

    implementation project(':loader-libgdx:box2d-v3.1.1-0')

}

application {
    mainClass = 'aurelienribon.bodyeditor.Main'
}

tasks.withType(Exec) {
    group = 'loader-demo'
}

jar {
    archiveFileName = "loader-libgdx-demo.jar"
}
