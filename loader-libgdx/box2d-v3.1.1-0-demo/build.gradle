plugins {
    id 'kotlin'
    id 'application'
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl:1.12.1"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:3.1.1-0:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-desktop"

    implementation project(":lib:box2d-editor:libs:tween-engine-api")

    implementation project(':lib:box2d-editor:loader:box2d-v3.1.1-0')

}

application {
    mainClass = 'aurelienribon.bodyeditor.Main'
}
